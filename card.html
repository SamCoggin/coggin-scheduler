<!DOCTYPE html>
<html title="Scheduling"><head><meta charset="utf-8"><title>Scheduling</title>
<style>
  :root{ --text:#172b4d; --muted:#5e6c84; --line:#c7ced8; --blue:#0c66e4; --blue-bg:#e9f2ff; --green:#1f845a; --green-bg:#e3fcef; --amber:#974f0c; --amber-bg:#fff7d6; --red:#c9372c; --red-bg:#ffeceb; --card:#fff; --list:#f1f2f4; }
  *{box-sizing:border-box}
  html,body{overflow:hidden}
  body{margin:0;padding:4px 2px 8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;font-size:15px;color:var(--text);background:transparent;line-height:1.35}
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  .sec{border:2px solid var(--line);border-radius:10px;margin-bottom:14px;background:var(--card);overflow:hidden}
  .sec-h{padding:10px 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;color:#fff}
  .sec-h .name{font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .sec-h .when{font-size:14px;font-weight:700;opacity:.95}
  .sec.transport .sec-h{background:var(--green)}
  .sec.production .sec-h{background:var(--blue)}
  .sec.labour .sec-h{background:#44546f}
  .sec.loading .sec-h{background:#974f0c}
  .sec.loading .who{background:var(--amber-bg)}
  .who{padding:12px 14px;font-size:16px;font-weight:800;border-bottom:1px solid var(--line);background:var(--green-bg)}
  .sec.production .who{background:var(--blue-bg)}
  .sec.labour .who{background:var(--list)}
  .who.none{background:var(--red-bg);color:var(--red)}
  .who small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
  .fld{padding:12px 14px;border-bottom:1px solid var(--line)}
  .fld:last-child{border-bottom:0}
  .lbl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
  .people{display:flex;flex-wrap:wrap;gap:8px}
  .p{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700}
  .p.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .p.off{opacity:.45;cursor:not-allowed;background:#eef0f3}
  .p .lv{font-style:normal;font-weight:600;font-size:11px;margin-left:6px}
  .p .drv{font-style:normal;font-weight:700;font-size:11px;margin-left:6px;border:1px solid currentColor;border-radius:4px;padding:1px 5px;opacity:.9}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row+.row{margin-top:8px}
  input[type=number],input[type=date],input[type=text]{border:2px solid var(--line);border-radius:6px;padding:7px 8px;font-weight:600}
  input[type=number]{width:70px}
  select{border:2px solid var(--line);border-radius:6px;padding:8px;background:var(--card);font-weight:700;width:100%}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
  .seg button{border:2px solid var(--line);background:var(--card);border-radius:6px;padding:8px 4px;font-weight:700}
  .seg button.on{border-color:var(--blue);background:var(--blue);color:#fff}
  .hint{color:var(--muted);font-size:13px;margin-top:6px}
  .avail{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .arow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
  .arow b{font-size:13px;min-width:64px}
  .arow span{border-radius:6px;padding:3px 8px;font-weight:700;background:var(--list);border:1px solid var(--line)}
  .arow .free{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)} .arow .over{color:var(--red);background:var(--red-bg);border-color:var(--red-bg)} .arow .off{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bg)}
  .warn{margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:14px}
  .status{font-size:13px;color:var(--muted);text-align:right}
  .srow{border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .stop2{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:12px 14px}
  .stop2 .sl{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
  .stop2 .sv{font-size:16px;font-weight:700}
  .srow.bad .sv{color:var(--red)} .srow.todo .sv{color:var(--amber)}
  .chg{border:2px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
  .sed{padding:0 14px 14px;background:var(--list);border-top:1px solid var(--line)}
  .sed .lbl{margin-top:12px}
  .sed .people{margin-top:4px}
  .stdbox{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
  .stdbox b{display:block;font-size:14px}
  .banner{padding:10px 14px;background:var(--red);color:#fff;font-weight:800;font-size:14px;border-bottom:1px solid var(--line)}
  .banner.plan{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .planbtn{border:0;background:#fff;color:var(--red);border-radius:8px;padding:8px 12px;font-weight:800;font-size:14px}
  .who{font-size:15px}
  .vtot{padding:10px 12px;border-radius:8px;background:var(--list);margin-bottom:10px}
  .vtot .big{font-size:18px;font-weight:800}
  .vtot .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .vbar{height:10px;border-radius:5px;background:#dfe3ea;margin-top:8px;overflow:hidden}
  .vbar i{display:block;height:100%;background:var(--green)} .vbar i.near{background:var(--amber)} .vbar i.over{background:var(--red)}
  .vlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
  .vrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
  .vrow:first-child{border-top:0}
  .vrow b{font-size:14px} .vrow b small{display:block;font-weight:500;color:var(--muted);font-size:12px} .vrow .m{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
  .vrow .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .vrow.bad{background:var(--red-bg)} .vrow.bad b,.vrow.bad .m{color:var(--red)}
  .vrow .rm{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
  .vadd{margin-top:10px}
  .vday{padding:10px 12px;border-radius:8px;background:var(--blue-bg);margin-bottom:10px;font-size:13px}
  .vday b{display:block;font-size:14px}
  .vday .sub{color:var(--muted);margin-top:4px}
  .vday .sub.bad{color:var(--red);font-weight:700}
  .vadd .lbl{margin-bottom:6px}
</style></head>
<!-- Trello gives its frame the signed URL as a hover tooltip. Chrome only lets the page inside the frame
     override that when its own title is NOT empty, and an invisible one draws an empty bubble that follows
     the mouse, so every layer says Scheduling (Sam, 14 Sep 2026: "why does this show sometimes?", then "why is this showing?"). -->
<body title="Scheduling">
<div id="app" title="Scheduling"></div>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>document.write('<script src="./shared.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<script>
(function(){
  var t=TrelloPowerUp.iframe();
  var el=function(tag,c,x){var n=document.createElement(tag);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
  var PARTS=null;
  var card=null, d=null, viewing=false, workshop=false, site=false, loading=false, saving=null, defaultDue=null, boardData={}, OTHERS=[], LEAVE=[];
  // the other cards on the board, with their plans, so this card can say who is free
  function loadOthers(){
    var cardsP=t.cards("id","name","due","start","idList","labels","desc","checklists").catch(function(){ return t.cards("id","name","due","start","idList","labels","desc"); });
    return Promise.all([cardsP, t.lists("all")]).then(function(r){
      var listName={}; r[1].forEach(function(l){ listName[l.id]=l.name; });
      var dated=r[0].filter(function(x){ return x.due && x.id!==card.id; }); var nameOf={}; r[0].forEach(function(x){ nameOf[x.id]=(x.name||"").split(" - ").slice(0,2).join(" - "); });
      LEAVE=dated.filter(function(x){ return /Holidays|Leave/i.test(listName[x.idList]||""); }).map(function(x){ return {date:x.due.slice(0,10),who:x.name.split(/\s*\(/)[0].trim()}; });

      return Promise.all(jobs.map(function(x){ return t.get(x.id,"shared","sched",null).then(function(p){
        var cc=[]; (x.checklists||[]).forEach(function(cl){ (cl.checkItems||[]).forEach(function(it){ cc.push({n:it.name||""}); }); });
        var L=loadOf(itemsOf(x.desc||"",cc).concat((p&&p.items)||[])); if(!L.any&&p&&p.load) L=p.load;
        var cube=p&&p.cube!=null?p.cube:(L.complete?L.m3:null);
        return {id:x.id,name:nameOf[x.id],due:x.due.slice(0,10),start:x.start?x.start.slice(0,10):null,site:isSiteLabels(x.labels,x.desc),plan:p||{who:[]},cube:cube,kg:L.complete?L.kg:0,why:cube!=null?"":(L.unmatched&&L.unmatched.length?"items not matched":"no items on the card")}; }); }));
    }).then(function(list){ OTHERS=list; }).catch(function(){ OTHERS=[]; });
  }
  function todayIso(){ var t=new Date(); t.setHours(12,0,0,0); return t.toISOString().slice(0,10); }
  function nextWorkDay(k){ var x=new Date(k+"T12:00"); while(x.getDay()===0||x.getDay()===6) x.setDate(x.getDate()+1); return x.toISOString().slice(0,10); }
  function addWorkDays(k,n){ var x=new Date(k+"T12:00"); var left=n; while(left>0){ x.setDate(x.getDate()+1); if(x.getDay()!==0&&x.getDay()!==6) left--; } return x.toISOString().slice(0,10); }
  function planBanner(text,btnText,onPlan){ var b=el("div","banner plan"); b.appendChild(el("span",null,text)); var bt=el("button","planbtn",btnText); bt.onclick=onPlan; b.appendChild(bt); return b; }
  function workDays(a,b){ var out=[]; if(!a) return out; for(var x=new Date(a+"T12:00"); ; x.setDate(x.getDate()+1)){ var k=x.toISOString().slice(0,10); if(k>(b||a)) break; if(x.getDay()!==0&&x.getDay()!==6) out.push(k); } return out; }
  function loadOn(k){
    var out={}; CREW.forEach(function(w){ out[w]={mins:0,n:0}; });
    LEAVE.forEach(function(l){ if(l.date===k&&out[l.who]) out[l.who].off=true; });
    OTHERS.forEach(function(o){ var p=o.plan;
      if(workDays(o.start&&o.start<o.due?o.start:o.due,o.due).indexOf(k)>=0){ (p.who||[]).forEach(function(w){ if(!out[w]) return; out[w].n++; out[w].mins+=(p.mins||0)+(o.site?(p.drive||0):0); }); }
      if(p.prep&&p.prep.date&&workDays(p.prep.start||p.prep.date,p.prep.date).indexOf(k)>=0){ (p.prep.who||[]).forEach(function(w){ if(!out[w]) return; out[w].n++; out[w].mins+=(p.prep.mins||0); }); }
      (p.legs||[]).forEach(function(L){ if(L.date===k) (L.who||[]).forEach(function(w){ if(!out[w]) return; out[w].n++; out[w].mins+=(L.mins||0)+(L.drive||0); }); });
    });
    CREW.forEach(function(w){ var x=out[w]; x.avail=x.off?0:Math.max(0,DAY_MINS-x.mins); x.t=x.off?"on leave":!x.n?"available":x.mins>DAY_MINS?fmt(x.mins)+", over capacity":!x.mins?x.n+(x.n===1?" job, no time":" jobs, no time"):fmt(x.mins)+" allocated"; x.c=x.off?"off":!x.n?"free":x.mins>DAY_MINS?"over":"busy"; });
    return out;
  }
  function availability(days,part){
    var box=el("div","avail"); if(!days.length){ box.appendChild(el("div","hint","Set the days to see who is available.")); return box; }
    days.slice(0,5).forEach(function(k){ var row=el("div","arow"); row.appendChild(el("b",null,niceShort(k))); var free=[], rest=[];
      var load=loadOn(k); CREW.forEach(function(w){ if(part.who.indexOf(w)>=0) return; var l=load[w]; if(l.c==="off") return; row.appendChild(el("span",l.c,w+": "+(l.c==="free"?fmt(DAY_MINS)+" available":l.c==="off"?"on leave":l.c==="over"?"over capacity":fmt(Math.max(0,DAY_MINS-l.mins))+" available"))); });
      if(row.children.length===1) row.appendChild(el("span","busy","everyone is on this job")); box.appendChild(row); });
    if(days.length>5) box.appendChild(el("div","hint","First 5 days shown."));
    return box;
  }
  function load(){
    return Promise.all([t.card("id","name","labels","idList","due","desc"), t.lists("all"), t.get("card","shared","sched",null), t.get("board","shared","sched",{})]).then(function(r){
      boardData=r[3]||{}; (boardData.contractors||[]).forEach(function(c){ if(CONTRACTORS.indexOf(c)<0) CONTRACTORS.splice(CONTRACTORS.length-1,0,c); });
      card=r[0]; var list=r[1].filter(function(l){return l.id===card.idList;})[0]; workshop=!!(list&&isWorkshopList(list.name,card.desc)); card.listName=list?list.name:"";
      viewing=isViewingLabels(card.labels); site=!viewing&&isSiteLabels(card.labels,card.desc); loading=!viewing&&!site&&isCollectLabels(card.labels,card.desc);
      defaultDue=productionDueFor(card.labels,(card.due||"").slice(0,10));
      d=r[2]||{who:[],mins:null,drive:null,contractor:"",prep:null,legs:[]}; if(!d.who) d.who=[]; if(!d.legs) d.legs=[];
      // THE LABOUR PART (Sam, 14 Sep 2026): from the card's Parts block, or implied by the label on an older card.
      PARTS=partsOf(card.desc); if(!PARTS.known) PARTS=impliedParts(card.labels);
      d.legs.forEach(function(L){ if(L.type==="warehouse"||L.type==="yard") L.type="labour"; });
      // ONLY WHEN SOMEBODY ELSE'S VEHICLE IS INVOLVED (Sam, 15 Sep 2026): a stale labour leg nobody is on is dropped.
      var wantedL=partsCarrier(PARTS)?(PARTS.labourLegs||[]):[], dropped=false;
      for(var li=d.legs.length-1;li>=0;li--){ var Lx=d.legs[li]; if(Lx.type!=="labour"||Lx.src==="support") continue; if(!wantedL.some(function(x){return x.where===Lx.where;})&&!(Lx.who&&Lx.who.length)&&Lx.mins==null){ d.legs.splice(li,1); dropped=true; } }
      wantedL.forEach(function(x){ if(!d.legs.some(function(L){return L.type==="labour"&&L.where===x.where;})) d.legs.push({type:"labour",date:x.date||(card.due?card.due.slice(0,10):null),who:[],mins:null,drive:null,where:x.where}); });
      // TRAVEL FROM THE POSTCODE (Sam, 17 Sep 2026): a site job with no travel yet gets the return drive from the
      // description's postcode, the same figure the Scheduler page uses. Typed travel is never overwritten.
      if(site&&d.drive==null){ var dv=driveFor(card.name,card.desc); if(dv!=null){ d.drive=dv; dropped=true; } }
      if(dropped) save(); if(workshop&&!d.prep) d.prep={who:[],mins:null,start:null,date:null};
      render();
      // checklists only come through the board-wide cards call, the same way the Scheduler reads them
      // THE CARD'S OWN CHECKLIST FIRST (Sam, 17 Sep 2026: 533E11 in New Jobs read "No estimate yet" with four
      // items on it). t.card("checklists") is a documented field; the board-wide read stays as the fallback.
      var fromCards=function(){ return t.cards("id","checklists").then(function(cs){ var me=cs.filter(function(x){return x.id===card.id;})[0]; if(me&&me.checklists&&me.checklists.length) card.checklists=me.checklists; }); };
      // Three ways, noting what each gave so the Loading hint can say where it broke (17 Sep 2026).
      window.__ckTrace=[];
      var tryAll=function(){ return t.card("all").then(function(c3){ window.__ckTrace.push("all:"+(c3&&c3.checklists?c3.checklists.length:"none")); if(c3&&c3.checklists&&c3.checklists.length) card.checklists=c3.checklists; }).catch(function(e){ window.__ckTrace.push("all:error"); }); };
      var cl=t.card("checklists").then(function(c2){ window.__ckTrace.push("card:"+(c2&&c2.checklists?c2.checklists.length:"none")+(c2&&c2.checklists&&c2.checklists[0]?" keys "+Object.keys(c2.checklists[0]).join("/")+(c2.checklists[0].checkItems?" items "+c2.checklists[0].checkItems.length+(c2.checklists[0].checkItems[0]?" itemkeys "+Object.keys(c2.checklists[0].checkItems[0]).join("/"):""):""):"")); if(c2&&c2.checklists&&c2.checklists.length) card.checklists=c2.checklists; else return fromCards().then(function(){ window.__ckTrace.push("board:"+((card.checklists||[]).length)); if(!(card.checklists||[]).length) return tryAll(); }); }).catch(function(e){ window.__ckTrace.push("card:error"); return fromCards().catch(function(){ window.__ckTrace.push("board:error"); }).then(tryAll); });
      // TRELLO GIVES THE POWER-UP EMPTY CHECKLISTS (traced 17 Sep 2026: checkItems 0 on a card with six lines),
      // so the items come from the CRM's Trello access instead, with the board's CRM key.

        return fetch("https://coggin-sos-os.base44.app/api/apps/69c930a6240fba922f369aa2/functions/opsCardChecklist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:key,card_id:card.id})}).then(function(x){return x.json();}).then(function(res){ window.__ckTrace.push("crm:"+(res&&res.ok?res.items.length:(res&&res.error)||"failed")); if(res&&res.ok&&res.items.length) card.checklists=[{name:"Products",checkItems:res.items.map(function(i){return {name:i.n,state:i.done?"complete":"incomplete"};})}]; }).catch(function(){ window.__ckTrace.push("crm:failed"); }); }); });

    });
  }
  function save(){ clearTimeout(saving); saving=setTimeout(function(){ t.set("card","shared","sched",d); if(card&&card.id) syncCardMembers(card.id,d,boardData.crmKey||"",workshop); },250); }
  function hm(get,set,label){
    var w=el("span","row"); var v=get();
    var h=el("input"); h.type="number"; h.min="0"; h.value=v==null?"":String(Math.floor(v/60)); h.placeholder="0"; h.setAttribute("aria-label",label+" hours");
    var m=el("input"); m.type="number"; m.min="0"; m.max="55"; m.step="5"; m.value=v==null?"":String(v%60); m.placeholder="0"; m.setAttribute("aria-label",label+" minutes");
    var upd=function(){ if(h.value===""&&m.value==="") set(null); else set((parseInt(h.value,10)||0)*60+(parseInt(m.value,10)||0)); save(); render(); };

  }
  // A TIME CANNOT BE MISSED (Sam, 14 Sep 2026: "force adding a time when the person has been assigned"). When an

    CREW.forEach(function(n){ var picked=part.who.indexOf(n)>=0, off=offOn[n]&&!picked; var b=el("button","p"+(picked?" on":"")+(off?" off":""),n); if(off){ b.disabled=true; b.title=n+" is on leave"; b.appendChild(el("i","lv","on leave")); } if(transport&&DRIVERS.indexOf(n)>=0) b.appendChild(el("i","drv","driver")); b.onclick=function(){ var i=part.who.indexOf(n); if(i<0) part.who.push(n); else part.who.splice(i,1); if(part.who.length&&part.mins==null&&fill){ var m=fill(); if(m!=null) part.mins=m; } save(); render(); }; w.appendChild(b); });

  function fld(label){ var f=el("div","fld"); if(label) f.appendChild(el("div","lbl",label)); return f; }

    var r=el("div","row"); r.appendChild(el("span","hint","or exactly")); r.appendChild(hm(function(){return part.mins;},function(v){part.mins=v;},label)); f.appendChild(r);

  function whoLine(part,detail,contractor){

  }
  function section(kind,name,when){ var s=el("div","sec "+kind); var h=el("div","sec-h"); h.appendChild(el("span","name",name)); if(when) h.appendChild(el("span","when",when)); s.appendChild(h); return s; }
