<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Coggin Scheduler</title></head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>
  // the Power-Up connector: adds a "Scheduler" button to the board that
  // opens the scheduler page over the board
  TrelloPowerUp.initialize({
    "board-buttons": function(t){
      return [{ text: "Scheduler", callback: function(t){ return t.modal({ url: "./scheduler.html", fullscreen: true, title: "Scheduler" }); } }];
    }
  });
</script>
</body></html>
