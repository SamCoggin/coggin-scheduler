<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Coggin Scheduler</title></head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>document.write('<script src="./shared.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<script>
  // the Power-Up connector: a Scheduler button on the board, a badge on the
  // front of each card, a Scheduling section and a button on the back
  var ICON="https://samcoggin.github.io/coggin-scheduler/icon.png";
  function isSite(card){ return (card.labels||[]).some(function(l){return SITE_LABELS.test(l.name);}); }
  TrelloPowerUp.initialize({
    "board-buttons": function(t){
      return [{ text: "Scheduler", icon: ICON, callback: function(t){ return t.modal({ url: "./scheduler.html?v="+Math.floor(Date.now()/60000), fullscreen: true, title: "Scheduler" }); } }];
    },
    "card-badges": function(t){
      return Promise.all([t.card("labels","idList","due","badges"), t.get("card","shared","sched",null), t.lists("all")]).then(function(r){
        var card=r[0], d=r[1], out=[];
        var list=r[2].filter(function(l){return l.id===card.idList;})[0], workshop=!!(list&&WORKSHOP_LISTS.test(list.name));
        if(list&&READY_LIST.test(list.name)&&!qcDone(card.badges)) out.push({ text:"Not QC'd", color:"red" });
        if(workshop&&card.due){ var pd=(d&&d.prodDue)||productionDue("",card.due.slice(0,10)); var late=!!(d&&d.prep&&d.prep.date&&d.prep.date>pd); out.push({ text:"Production due "+niceShort(pd), color:late?"red":(pd<todayIso()?"red":"blue") }); }
        if(workshop&&d){ var pb=prodBadgeText(d); out.push({ text:pb.text, color:pb.color }); }
        if(d){ frontBadges(d,isSite(card)).forEach(function(b){ out.push({ text:b.text, color:b.color }); }); }
        return out;
      });
    },
    "card-detail-badges": function(t){
      return Promise.all([t.card("labels","idList","due","badges"), t.get("card","shared","sched",null), t.lists("all")]).then(function(r){
        var card=r[0], d=r[1], out=[];
        var list=r[2].filter(function(l){return l.id===card.idList;})[0], workshop=!!(list&&WORKSHOP_LISTS.test(list.name));
        if(list&&READY_LIST.test(list.name)&&!qcDone(card.badges)) out.push({ title:"QC", text:"Not QC'd: checklist not complete", color:"red" });
        if(workshop&&card.due){ var pd=(d&&d.prodDue)||productionDue("",card.due.slice(0,10)); out.push({ title:"Production due", text:niceShort(pd), color:pd<todayIso()?"red":"blue" }); }
        if(workshop&&d){ var pb2=prodBadgeText(d,true); out.push({ title:"Production", text:pb2.text.replace(/^Production:? ?/,""), color:pb2.color }); }
        if(!d) out.push({ title:"Scheduling", text:"Not planned", color:"yellow" }); else { var b=badgeText(d,isSite(card)); out.push({ title:"Scheduling", text:b.text, color:b.color }); }
        return out;
      });
    },
    "card-back-section": function(t){
      return { title:"Scheduling", icon:ICON, content:{ type:"iframe", url:t.signUrl("./card.html?v="+Math.floor(Date.now()/60000)), height:260 } };
    },
    "card-buttons": function(t){
      return [{ icon:ICON, text:"Open in Scheduler", callback:function(t){ return t.modal({ url:"./scheduler.html?v="+Math.floor(Date.now()/60000), fullscreen:true, title:"Scheduler" }); } }];
    }
  });
</script>
</body></html>
