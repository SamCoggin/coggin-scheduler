<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Coggin Scheduler</title></head>
<body>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script>document.write('<script src="./shared.js?v='+Math.floor(Date.now()/60000)+'"><\/script>');</script>
<script>
  // the Power-Up connector: a Scheduler button on the board, a badge on the
  // front of each card, a Scheduling section and a button on the back
  var ICON="https://samcoggin.github.io/coggin-scheduler/icon.png";
  function isSite(card){ return isSiteLabels(card.labels,card.desc); }
  // ON OPERATIONS - PLANNING (Sam added the Power-Up there 17 Sep 2026) only the new job lists are jobs: the
  // templates, supplier orders and completed cards are not, so they get no badges. The board Scheduler page
  // and its card button stay on Jobs - Planning Board, the board it plans.
  var OPS_BOARD=/^operations\s*-\s*planning$/i, OPS_JOB_LISTS=/^(new jobs|transfer to job board)$/i;
  // SUPPLIES ARE NOT JOBS (Sam, 21 Sep 2026: "remove the scheduling from the supplies request list and card as it
  // is not needed"). A card in Supplies Request gets no Scheduling section and no badges, on either board.
  var NOT_A_JOB_LISTS=/^supplies request$/i;
  // ON JOBS - PLANNING BOARD only the lists the Scheduler plans carry badges (Sam, 17 Sep 2026: "Need to remove
  // the noise here also"). Leave, the transfer lists and undated Other Planned Activity cards get none.
  var PLANNED_LISTS=/^(Workshop Jobs - (Not Started|In-progress|Ready for Delivery \/ Collection)|Removals \/ Recycling \/ Skips \/ Stock \/ Plastic|Other Planned Activity|Job Issue|Facility Jobs|Operations Transfer List)$/;
  var DUE_ONLY_LISTS=/^(Removals \/ Recycling \/ Skips \/ Stock \/ Plastic|Other Planned Activity|Job Issue|Facility Jobs)$/;
  function quiet(ops,list,card){ var n=String(list&&list.name||"").trim(); if(NOT_A_JOB_LISTS.test(n)) return true; if(ops) return !OPS_JOB_LISTS.test(n); if(!PLANNED_LISTS.test(n)) return true; return DUE_ONLY_LISTS.test(n)&&!card.due; }
  function opsBoard(t){ return t.board("name").then(function(b){ return OPS_BOARD.test(String(b&&b.name||"").trim()); }).catch(function(){ return false; }); }
  TrelloPowerUp.initialize({
    "board-buttons": function(t){
      // ON OPERATIONS - PLANNING THE BUTTON GOES TO THE PLANNING BOARD (Sam, 17 Sep 2026: "why isnt the scheduler
      // showing so I can click on it"). The Scheduler page can only read the board it is opened on, and the jobs it
      // plans are on Jobs - Planning Board, so here the button takes you there.
      return opsBoard(t).then(function(ops){ if(ops) return [{ text: "Scheduler", icon: ICON, callback: function(t){ return t.navigate({ url: "https://trello.com/b/2Y4OF3cX" }); } }]; return [{ text: "Scheduler", icon: ICON, callback: function(t){ return t.modal({ url: "./scheduler.html?v="+Math.floor(Date.now()/60000), fullscreen: true, title: "Scheduler" }); } }]; });
    },
    "card-badges": function(t){
      return Promise.all([t.card("labels","idList","due","badges","desc"), t.get("card","shared","sched",null), t.lists("all"), opsBoard(t), t.get("board","shared","sched",null)]).then(function(r){
        var card=r[0], d=r[1], out=[], round=roundFor(r[4],(card.due?card.due.slice(0,10):null)||(d&&d.date),d&&d.who);
        var list=r[2].filter(function(l){return l.id===card.idList;})[0], workshop=!!(list&&isWorkshopList(list.name,card.desc));
        if(quiet(r[3],list,card)) return out;
        // A QC sign-off or "not applicable" on the card back clears the badge (Sam, 14 Sep 2026).
        if(list&&READY_LIST.test(list.name)&&/^(Resale|Refurb)/i.test(workOf(card.labels)||"")&&!qcDone(card.badges)&&!(d&&d.qc)) out.push({ text:"Not QC'd", color:"red" });
        if(workshop&&card.due){ var pd=(d&&d.prodDue)||productionDueFor(card.labels,card.due.slice(0,10)); var late=!!(d&&d.prep&&d.prep.date&&d.prep.date>pd); out.push({ text:"Production due "+niceShort(pd), color:late?"red":(pd<todayIso()?"red":"blue") }); }
        // A card nobody has planned yet is the one that most needs saying so (Sam, 14 Sep 2026: "why does
        // D9D283 not have production not scheduled and transport unassigned?"). No saved plan reads as an empty one.
        var plan=d||{};
        if(workshop){ var pb=prodBadgeText(plan); out.push({ text:pb.text, color:pb.color }); }
        // a viewing order is production only: no transport or labour badge (17 Sep 2026)
        // EACH LIST SHOWS ITS OWN PART (Sam, 2 Oct 2026: "Labour for collection is not needed to be seen at not started
        // yet and should be in Ready for delivery/collection"). Not Started and In-progress carry production only; the
        // labour, installation or courier badge appears once the card reaches Ready for Delivery / Collection. The back
        // of the card still shows every part.
        var inWorkshop=!!(list&&WORKSHOP_LISTS.test(String(list.name||"").trim()));
        if(!isViewingLabels(card.labels)&&!inWorkshop) frontBadges(plan,isSite(card)?movementOf(card.labels,card.desc):false,round).forEach(function(b){ out.push({ text:b.text, color:b.color }); });
        return out;
      });
    },
    "card-detail-badges": function(t){
      return Promise.all([t.card("labels","idList","due","badges","desc"), t.get("card","shared","sched",null), t.lists("all"), opsBoard(t), t.get("board","shared","sched",null)]).then(function(r){
        var card=r[0], d=r[1], out=[], round=roundFor(r[4],(card.due?card.due.slice(0,10):null)||(d&&d.date),d&&d.who);
        var list=r[2].filter(function(l){return l.id===card.idList;})[0], workshop=!!(list&&isWorkshopList(list.name,card.desc));
        if(quiet(r[3],list,card)) return out;
        if(list&&READY_LIST.test(list.name)&&/^(Resale|Refurb)/i.test(workOf(card.labels)||"")&&!qcDone(card.badges)&&!(d&&d.qc)) out.push({ title:"QC", text:"Not QC'd: checklist not complete", color:"red" });
        else if(d&&d.qc&&list&&READY_LIST.test(list.name)) out.push({ title:"QC", text:d.qc.na?"Not applicable, "+d.qc.by:"Passed, "+d.qc.by, color:"green" });
        if(workshop&&card.due){ var pd=(d&&d.prodDue)||productionDueFor(card.labels,card.due.slice(0,10)); out.push({ title:"Production due", text:niceShort(pd), color:pd<todayIso()?"red":"blue" }); }
        var plan2=d||{};
        // SHORT BADGES, SEVERAL OF THEM (Sam, 20 Oct 2026: "this UI is shit"). Trello draws each detail badge as one coloured
        // block, so a whole sentence in one badge wraps into a slab. Days, crew and time are their own badges; a plan
        // still missing something keeps the one yellow badge that says what.
        var sd=function(k){ var x=new Date(k+"T12:00"); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][x.getDay()]+" "+x.getDate(); };
        if(workshop){ var P=plan2.prep, pb2=prodBadgeText(plan2,true);
          if(pb2.color!=="blue"||!P) out.push({ title:"Production", text:pb2.text.replace(/^Production:? ?/,""), color:pb2.color });
          else { out.push({ title:"Production days", text:(P.start&&P.start!==P.date?niceShort(P.start)+" to "+niceShort(P.date):niceShort(P.date)), color:"blue" });
            var spans=prepHasSpans(P);
            out.push({ title:spans?"Crew, their own days":"Crew", text:spans?(P.who||[]).map(function(w){ var ds=prepDaysFor(P,w); return w.split(" ")[0]+(ds.length?" "+(ds.length===1?sd(ds[0]):sd(ds[0])+" to "+sd(ds[ds.length-1])):""); }).join(" \u00b7 "):(P.who||[]).join(", "), color:"blue" });
            var pd=prepPerDay(P), nd=prepDayCount(P); out.push({ title:"Time", text:nd>1?fmt(pd)+" a day each":fmt(P.mins)+((P.who||[]).length>1?" each":""), color:"blue" }); } }
        if(!isViewingLabels(card.labels)){ var mv=isSite(card)?movementOf(card.labels,card.desc):false, b=badgeText(plan2,mv,round,list&&/^Facility Jobs$/i.test(String(list.name||"").trim())?"Facility":"");
          if(b.color!=="green") out.push({ title:"Scheduling", text:b.text, color:b.color });
          else { var who2=plan2.who||[], what=mv?String(mv):"Labour";
            out.push({ title:what+" crew", text:who2.join(", "), color:"green" });
            var tt=mv?(round?"on the round, "+fmt(round.total)+" travel":(plan2.drive?fmt(plan2.drive)+" travel":"")):"";
            out.push({ title:what+" time", text:fmt(plan2.mins)+(who2.length>1?" each":"")+(tt?" \u00b7 "+tt:""), color:"green" }); } }
        return out;
      });
    },
    "card-back-section": function(t){
      return Promise.all([opsBoard(t), t.card("idList"), t.lists("all")]).then(function(r){ var list=r[2].filter(function(l){return l.id===r[1].idList;})[0]; if(list&&NOT_A_JOB_LISTS.test(String(list.name||"").trim())) return null; if(r[0]&&!(list&&OPS_JOB_LISTS.test(String(list.name||"").trim()))) return null;
      return { title:"Scheduling", icon:ICON, content:{ type:"iframe", url:t.signUrl("./card.html?v="+Math.floor(Date.now()/60000)), height:260 } }; });
    },
    "card-buttons": function(t){
      return opsBoard(t).then(function(ops){ if(ops) return []; return [{ icon:ICON, text:"Open in Scheduler", callback:function(t){ return t.modal({ url:"./scheduler.html?v="+Math.floor(Date.now()/60000), fullscreen:true, title:"Scheduler" }); } }]; });
    }
  });
</script>
</body></html>
