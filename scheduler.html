<title>Coggin Scheduler</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>

  .hdr{zoom:.88;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}

.tip{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;line-height:1;padding:0;margin-left:6px;vertical-align:middle}

  #map{flex:1;min-height:320px}

  .rday{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:0 0 8px}
  .rday h3{margin:0;padding:10px 14px;font-size:16px;font-weight:800;color:#fff;border-radius:9px 9px 0 0;display:flex;justify-content:space-between}
  .rday h3 span{font-weight:600;font-size:13px;opacity:.95}
  .rgrp{padding:8px 14px 4px}

  .stop b{display:block} .stop small{color:var(--muted);font-weight:600;font-size:12px}

  .rwarn{margin:6px 14px 0;padding:8px 10px;border-radius:8px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:13px}
  .rnote{color:var(--muted);font-size:13px;padding:6px 14px}
  .prow2 .drv{font-style:normal;font-weight:600;font-size:11px;color:var(--muted);margin-left:6px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}

  .crew i{font-style:normal;font-weight:600;font-size:11px;opacity:.8;margin-left:4px}

  .board.day{grid-template-columns:repeat(4,minmax(260px,1fr))}
  .board.month{grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:8px;overflow:hidden}
  .mh{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:4px 6px}
  .mcell{background:var(--list);border:2px solid #3d4451;border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}

  .mcell .d{font-weight:800;font-size:16px;display:flex;justify-content:space-between}

  .mp .p{color:#0055cc} .mp .t{color:#1f845a} .mp .y{color:#626f86} .mp .l{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bg)}
  .mp .ov{color:var(--red);background:var(--red-bg);border-color:var(--red-bg)}

  .prow li{margin:2px 0}

  .sec-h{flex-shrink:0;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:9px 12px;margin-top:8px;display:flex;justify-content:space-between;background:rgba(9,30,66,.10);border-radius:6px}

  .avs{display:flex;padding-right:8px}
  .bdg{margin-left:auto;font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--list);color:var(--muted)}

  .tot{border-top:2px solid #3d4451;background:var(--card);border-radius:0 0 10px 10px;padding:10px 14px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}

  .bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}

  .modal h3{margin:0;font-size:20px;font-weight:700;flex:1;line-height:1.3}

  .people{display:flex;gap:8px;flex-wrap:wrap}

  .person .av{margin:0;border:0;background:var(--line);color:var(--muted)}
  .person .pn{display:flex;flex-direction:column;line-height:1.2;text-align:left}
  .person .ld{font-weight:500;font-size:12px;color:var(--muted)}
  .person .ld.free{color:var(--green);font-weight:700} .person .ld.over{color:var(--red);font-weight:700} .person .ld.off{color:var(--amber)}

      var lv=LEAVE.filter(function(l){return l.date===k;}); if(lv.length){ var lh=el("div","sec-h"); var lhl=el("span",null,"Annual Leave"); lhl.appendChild(tip("leave")); lh.appendChild(lhl); cards.appendChild(lh); lv.forEach(function(l){ cards.appendChild(el("div","leave",l.text)); }); }
      var rounds=roundsOn(k,jobs); jobs.forEach(function(j){ j.onRound=rounds.some(function(r){return r.stops.indexOf(j)>=0;}); });
      var groups=[["shop","Production",preps],["road","Transport",jobs.filter(function(j){return j.site;})],["yard","Yard Operations",jobs.filter(function(j){return !j.site&&!(j.isLeg&&j.leg.type==="production");})]];
      var prodLegs=jobs.filter(function(j){return j.isLeg&&j.leg.type==="production";}); prodLegs.forEach(function(j){ groups[0][2]=groups[0][2].concat([j]); });
      groups.forEach(function(g){
        if(!g[2].length) return;
        var sh=el("div","sec-h"+(g[0]==="shop"?" shop":"")); var shl=el("span",null,g[1]); shl.appendChild(tip(g[0])); sh.appendChild(shl); sh.appendChild(el("span",null,String(g[2].length))); cards.appendChild(sh);
        if(g[0]==="road") rounds.forEach(function(r){ cards.appendChild(roundEl(r)); });
        g[2].forEach(function(j){ cards.appendChild(cardEl(j,k,g[0]==="shop",isToday)); });
      });
      list.appendChild(cards);
      var tot=el("div","tot"); var th=el("div"); var thl=el("span","n","Operative Hours"); thl.appendChild(tip("tot")); th.appendChild(thl); tot.appendChild(th); var off=LEAVE.filter(function(l){return l.date===k;}).map(function(l){return l.text.split(" ")[0];});
      TEAM.forEach(function(w){
        var mine=jobs.filter(function(j){return j.who.indexOf(w)>=0;}), myPreps=preps.filter(function(j){return j.prep.who.indexOf(w)>=0;});
        var myRound=rounds.filter(function(r){return r.who===w;})[0];
        var mins=mine.reduce(function(s,j){return s+(j.mins||0)+(j.site&&!j.onRound?(j.drive||0):0);},0)+(myRound&&myRound.drive?myRound.drive:0);
        mins+=myPreps.reduce(function(s,j){return s+(j.prep.mins||0);},0);
        var unset=mine.filter(function(j){return j.mins==null;}).length+myPreps.filter(function(j){return j.prep.mins==null;}).length;
        mine=mine.concat(myPreps);
        var row=el("div"); row.appendChild(el("span","n",w));
        var txt, cls;
        if(off.indexOf(w)>=0){ txt="annual leave"; cls="free"; }
        else if(!mine.length){ txt="Recycling"; cls="free"; }
        else if(unset&&!mins){ txt=unset+(unset===1?" job, no time":" jobs, no time"); cls="todo"; }
        else { txt=fmt(mins)+(unset?" + "+unset+" no time":"")+(mins>DAY_H*60?", over capacity":""); cls=mins>DAY_H*60?"over":(unset?"todo":"ok"); }
        row.appendChild(el("span",cls,txt)); tot.appendChild(row);
        if(mins){ var bar=el("div","bar"); var fill=el("i",mins>DAY_H*60?"over":""); fill.style.width=Math.min(100,mins/(DAY_H*60)*100)+"%"; bar.appendChild(fill); tot.appendChild(bar); }
      });
      list.appendChild(tot); b.appendChild(list);
    }
    var mo=openRound?roundModal():modal(); if(mo){ document.body.appendChild(mo); if(window.__keepScroll) mo.scrollTop=window.__keepScroll; }
    $("#prev").onclick=function(){week--;render();}; $("#next").onclick=function(){week++;render();};
  }
  if(t){
    $("#src").textContent="Reading the board...";
    loadBoard().then(function(snap){ buildFromSnap(snap); lastSaved={}; JOBS.forEach(function(j){}); render(); }).catch(function(e){ $("#src").textContent="Could not read the board: "+(e&&e.message||e); });
  } else { $("#src").textContent="Open this from the Scheduler button on the Trello board."; }
})();
