<title>Coggin Scheduler</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{ --board:#cfd6e0; --list:#eef0f3; --card:#fff; --text:#172b4d; --muted:#5e6c84; --line:#b8c0cc; --blue:#0c66e4; --blue-bg:#e9f2ff; --red:#c9372c; --red-bg:#ffeceb; --green:#1f845a; --green-bg:#e3fcef; --amber:#974f0c; --amber-bg:#fff7d6; --shadow:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31); }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --board:#1d2125; --list:#101204; --card:#22272b; --text:#b6c2cf; --muted:#8c9bab; --line:#4a5661; --blue:#579dff; --blue-bg:#1c2b41; --red:#f87168; --red-bg:#42221f; --green:#4bce97; --green-bg:#1c3329; --amber:#f5cd47; --amber-bg:#3d2e00; --shadow:0 1px 1px rgba(0,0,0,.5); }}
  :root[data-theme="dark"]{ --board:#1d2125; --list:#101204; --card:#22272b; --text:#b6c2cf; --muted:#8c9bab; --line:#4a5661; --blue:#579dff; --blue-bg:#1c2b41; --red:#f87168; --red-bg:#42221f; --green:#4bce97; --green-bg:#1c3329; --amber:#f5cd47; --amber-bg:#3d2e00; --shadow:0 1px 1px rgba(0,0,0,.5); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--board);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,"Helvetica Neue",sans-serif;font-size:14px;line-height:1.4;overflow:hidden}
  button,input{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

  .hdr{zoom:.88;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .hdr h1{font-size:22px;font-weight:800;margin:0}
  .hdr .src{color:var(--muted);font-size:13px;margin-right:auto;margin-left:6px}
  .hdr button{border:0;background:var(--list);border-radius:6px;padding:7px 14px;font-weight:600}
  .hdr button:hover{background:var(--line)}
  .hdr .t{font-weight:800;min-width:210px;text-align:center;font-size:17px}
.tip{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:11px;font-weight:700;line-height:1;padding:0;margin-left:6px;vertical-align:middle}
  .tip:hover{border-color:var(--blue);color:var(--blue)}
  .tipw{position:relative;display:inline-block}
  .tipp{position:absolute;left:0;top:24px;z-index:5;background:var(--text);color:#fff;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;line-height:1.4;padding:8px 10px;border-radius:8px;width:240px;box-shadow:0 4px 12px rgba(9,30,66,.3)}
  .hdr .views{display:inline-flex;gap:4px;margin-right:8px;background:var(--list);border-radius:8px;padding:3px}
  .hdr .views button{padding:5px 12px;border-radius:6px;background:transparent}
  .hdr .views button.on{background:var(--card);box-shadow:var(--shadow)}
  .hdr #need.on{background:#c9372c;color:#fff}
  .board.routes{grid-template-columns:minmax(380px,1.3fr) minmax(340px,1fr);overflow:hidden}
  .mapwrap{background:var(--list);border:2px solid #3d4451;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .mapwrap .legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  #map{flex:1;min-height:320px}
  .rpanel{background:var(--list);border:2px solid #3d4451;border-radius:12px;overflow:auto;min-height:0;padding:10px;display:flex;flex-direction:column;gap:10px}
  .rday{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:0 0 8px}
  .rday h3{margin:0;padding:10px 14px;font-size:16px;font-weight:800;color:#fff;border-radius:9px 9px 0 0;display:flex;justify-content:space-between}
  .rday h3 span{font-weight:600;font-size:13px;opacity:.95}
  .rgrp{padding:8px 14px 4px}
  .rgrp .k{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;display:flex;justify-content:space-between}
  .rgrp .k .ok{color:var(--green)} .rgrp .k .over{color:var(--red)}
  .stop{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
  .stop:first-of-type{border-top:0}
  .stop .n{width:22px;height:22px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
  .stop b{display:block} .stop small{color:var(--muted);font-weight:600;font-size:12px}
  .stop .mi{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
  .near{margin:6px 14px 4px;padding:8px 10px;border-radius:8px;background:var(--blue-bg);font-size:13px;line-height:1.4}
  .near b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
  .near div{padding:3px 0}
  .near .no{color:var(--red);font-weight:700}
  .combine{background:var(--card);border:2px solid var(--blue);border-radius:10px;padding:0 0 6px}
  .combine h3{margin:0;padding:10px 14px;font-size:16px;font-weight:800;background:var(--blue);color:#fff;border-radius:8px 8px 0 0;display:flex;justify-content:space-between}
  .combine h3 span{font-weight:600;font-size:13px}
  .sug{margin:8px 10px 0;padding:10px 12px;border-radius:8px;background:var(--blue-bg);font-size:14px;line-height:1.45}
  .sug b{display:block;font-size:15px;margin-bottom:4px}
  .sug .save{color:var(--green);font-weight:800}
  .sug .must{margin-top:6px;padding:6px 8px;border-radius:6px;background:var(--card);font-weight:600}
  .sug .must.bad{color:var(--red)}
  .sug .steps{margin-top:6px;color:var(--muted);font-size:13px}
  .fleet{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px}
  .fleet b{font-size:13px;text-transform:uppercase;letter-spacing:.03em}
  .fleet button{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:700;background:var(--list)}
  .fleet button.on{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)} .fleet button.off{color:var(--red);background:var(--red-bg);border-color:var(--red-bg)}
  .weektot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--card);border:2px solid #3d4451;border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}
  .weektot .n{text-transform:uppercase;letter-spacing:.04em;font-size:13px;margin-right:6px}
  .weektot span:not(.n){border-radius:6px;padding:4px 10px;background:var(--green-bg);color:var(--green)}
  .weektot span.low{background:var(--amber-bg);color:var(--amber)}
  .weektot span.team{background:var(--list);color:var(--text)}
  .prow li.rec{color:var(--green);font-weight:700}
  .vtot{padding:10px 12px;border-radius:8px;background:var(--list);margin-bottom:10px}
  .vtot .big{font-size:18px;font-weight:800}
  .vtot .sub,.vday .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .vbar{height:10px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}
  .vbar i{display:block;height:100%;background:var(--green)} .vbar i.near{background:var(--amber)} .vbar i.over{background:var(--red)}
  .vday{padding:10px 12px;border-radius:8px;background:var(--blue-bg);margin-bottom:10px;font-size:13px}
  .vday b{display:block;font-size:14px}
  .vlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
  .vrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
  .vrow:first-child{border-top:0}
  .vrow b{font-size:14px} .vrow b small{display:block;font-weight:500;color:var(--muted);font-size:12px} .vrow .m{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
  .vrow .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
  .vrow.bad{background:var(--red-bg)} .vrow.bad b,.vrow.bad .m{color:var(--red)}
  .vrow .rm{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
  .vadd{margin-top:10px} .vadd .lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
  .vadd select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--card);font-weight:600;flex:1}
  .board.manager{grid-template-columns:1fr;overflow:auto}
  .mgr{background:var(--card);border:2px solid #3d4451;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;align-self:start}
  .mgr h2{margin:0;font-size:20px;font-weight:800}
  .mgr .sub{color:var(--muted);font-size:14px}
  .pin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pin input{border:2px solid var(--line);border-radius:8px;padding:10px 12px;font-size:20px;font-weight:700;letter-spacing:.3em;width:140px;text-align:center}
  .pin button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 16px;font-weight:700}
  .pin .bad{color:var(--red);font-weight:700}
  .mrow{display:grid;grid-template-columns:minmax(220px,1.4fr) 110px 1fr 1fr 130px;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .mrow.head{background:var(--list);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:0}
  .mrow.amber{border-color:var(--amber);background:var(--amber-bg)} .mrow.red{border-color:var(--red);background:var(--red-bg)}
  .mrow b{font-size:15px;display:block} .mrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .mrow .v{font-size:18px;font-weight:800} .mrow.amber .v{color:var(--amber)} .mrow.red .v{color:var(--red)} .mrow .v.ok{color:var(--green)}
  .mrow ul{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--muted)} .mrow li{margin:1px 0}
  .msum{display:flex;flex-wrap:wrap;gap:8px}
  .msum span{border-radius:8px;padding:8px 12px;background:var(--list);font-weight:700;font-size:14px}
  .msum span.amber{background:var(--amber-bg);color:var(--amber)} .msum span.red{background:var(--red-bg);color:var(--red)}
  .rwarn{margin:6px 14px 0;padding:8px 10px;border-radius:8px;background:var(--red-bg);color:var(--red);font-weight:700;font-size:13px}
  .rnote{color:var(--muted);font-size:13px;padding:6px 14px}
  .prow2 .drv{font-style:normal;font-weight:700;font-size:11px;color:var(--blue);margin-left:6px;border:1px solid var(--blue);border-radius:4px;padding:1px 5px}
  .banner{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:14px}
  .save.sticky{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 24px 16px;margin-top:8px}
  .modal.wide .save.sticky{padding:12px 24px 16px;margin-top:8px}
  .crew{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line)}
  .crew span{font-size:13px;font-weight:700;border-radius:6px;padding:4px 9px;border:1px solid var(--line);background:var(--list)}
  .crew .free{color:var(--green);background:var(--green-bg);border-color:var(--green-bg)} .crew .over{color:var(--red);background:var(--red-bg);border-color:var(--red-bg)} .crew .off{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bg)}
  .crew i{font-style:normal;font-weight:600;font-size:11px;opacity:.8;margin-left:4px}
  .leaflet-container{font-family:inherit}
  .board.day{grid-template-columns:repeat(4,minmax(260px,1fr))}
  .board.month{grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:8px;overflow:hidden}
  .mh{font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:4px 6px}
  .mcell{background:var(--list);border:2px solid #3d4451;border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden}
  .mcell.today{border-color:var(--blue)}
  .mcell.dim{opacity:.35}
  .mcell .d{font-weight:800;font-size:16px;display:flex;justify-content:space-between}
  .mcell .d span{font-weight:600;font-size:12px;color:var(--muted)}
  .mcell:hover{outline:2px solid var(--blue)}
  .mp{display:flex;flex-direction:column;gap:4px}
  .mp span{font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--card);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mp .p{color:#0055cc} .mp .t{color:#1f845a} .mp .y{color:#626f86} .mp .l{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bg)}
  .mp .ov{color:var(--red);background:var(--red-bg);border-color:var(--red-bg)}
  .prow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex-shrink:0}
  .prow .av{margin:0;border:0;width:32px;height:32px;font-size:12px}
  .prow b{display:block;font-size:16px}
  .prow .ld{font-size:12px;font-weight:600}
  .prow .ld.free{color:var(--green)} .prow .ld.over{color:var(--red)} .prow .ld.off{color:var(--amber)} .prow .ld.busy{color:var(--muted)}
  .prow ul{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--muted)}
  .prow li{margin:2px 0}

  .board{zoom:.88;display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;padding:12px 16px;flex:1;min-height:0;overflow-x:auto}
  .list{background:var(--list);border-radius:12px;display:flex;flex-direction:column;min-height:0;border:2px solid #3d4451;box-shadow:0 2px 6px rgba(9,30,66,.18)}
  .list.today{border-color:var(--blue)}
  .list h2{font-size:18px;font-weight:800;margin:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border-bottom:2px solid #3d4451;border-radius:10px 10px 0 0}
  .list h2 span{color:var(--muted);font-weight:500;font-size:12px}
  .list h2{flex-wrap:wrap}
  .list h2 .viewday{order:3;flex-basis:100%;margin-top:8px;border:1px solid var(--line);background:var(--list);border-radius:6px;padding:5px 10px;font-size:13px;font-weight:700;color:var(--blue);text-align:center}
  .list h2 .viewday:hover{background:var(--blue-bg);border-color:var(--blue)}
  .list.today h2 em{font-style:normal;color:var(--blue)}
  .cards{flex:1;overflow:auto;padding:8px 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:0}
  .sec-h{flex-shrink:0;font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text);padding:9px 12px;margin-top:8px;display:flex;justify-content:space-between;background:rgba(9,30,66,.10);border-radius:6px}
  .sec-h:first-child{margin-top:0}
  .sec-h.shop{color:#0055cc;background:rgba(0,85,204,.14)}
  .card{background:var(--card);border-radius:8px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(9,30,66,.2);padding:0;text-align:left;width:100%;position:relative;overflow:hidden;flex-shrink:0}
  .card .top{padding:8px 12px 4px}
  .card .mid{padding:0 12px 8px}
  .card .foot{padding:6px 12px 8px;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;background:rgba(9,30,66,.04)}
  .card:hover{outline:2px solid var(--blue)}
  .card.shop{background:var(--blue-bg)}
  .card.round{background:var(--green-bg);border-color:#1f845a}
  .lab{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:2px 8px;margin-bottom:6px;line-height:1.3}
  .lab.stage{background:var(--list);color:var(--text);border:1px solid var(--line);margin-left:4px}
  .card.shop .lab.stage{background:#0055cc;color:#fff;border-color:#0055cc}
  .ttl{font-weight:700;display:block;font-size:16px;line-height:1.3;color:var(--text)}
  .for{display:block;font-size:13px;color:var(--muted);margin-top:3px;font-weight:500}
  .for.late{color:var(--red);font-weight:700}
  .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
  .av{width:28px;height:28px;border-radius:50%;background:#0c66e4;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--card);margin-right:-8px}
  .avs{display:flex;padding-right:8px}
  .bdg{margin-left:auto;font-size:12px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--list);color:var(--muted)}
  .bdg.todo{background:var(--amber-bg);color:var(--amber)}
  .bdg.sub{background:#6e5dc6;color:#fff}
  .bdg.now{background:var(--red-bg);color:var(--red)}
  .card.hold{border:2px dashed #6e5dc6;background:repeating-linear-gradient(135deg,var(--card),var(--card) 8px,rgba(110,93,198,.08) 8px,rgba(110,93,198,.08) 16px);cursor:default}
  .card.hold .ttl{color:#6e5dc6}
  .for.hold{color:#6e5dc6;font-weight:700}
  .daywarn{flex-shrink:0;margin:0 8px 6px;padding:8px 10px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;font-size:13px}
  .printsheet{display:none}
  @media print{
    @page{size:A4 landscape;margin:12mm}
    body{background:#fff;color:#111;display:block;height:auto;overflow:visible}
    .hdr,.veil{display:none!important}
    .board{display:none!important}
    .printsheet svg.plan{width:100%;height:auto;max-height:110mm;display:block;margin:0 0 3mm;break-inside:avoid}
    .printsheet .ptab.routes th:nth-child(1){width:6%} .printsheet .ptab.routes th:nth-child(2){width:38%} .printsheet .ptab.routes th:nth-child(3){width:12%} .printsheet .ptab.routes th:nth-child(4){width:12%} .printsheet .ptab.routes th:nth-child(5){width:18%} .printsheet .ptab.routes th:nth-child(6){width:14%}
    .printsheet .ptab td.num{font-weight:800;font-size:12pt}
    .printsheet{display:block!important;font-size:10.5pt;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .printsheet h1{font-size:19pt;margin:0 0 1.5mm}
    .printsheet .sub{color:#444;margin:0 0 4mm;font-size:9.5pt}
    .printsheet .pdayh{background:#1D3058;color:#fff;padding:2mm 3.5mm;border-radius:2mm;margin:5mm 0 0;font-size:14pt;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;break-after:avoid}
    .printsheet .pdayh .sub2{font-size:10pt;font-weight:600;opacity:.95}
    .printsheet .ptab{width:100%;border-collapse:collapse;margin:0;table-layout:fixed}
    .printsheet .ptab thead{display:table-header-group}
    .printsheet .ptab th{text-align:left;font-size:9pt;text-transform:uppercase;letter-spacing:.04em;color:#333;background:#e8ebef;padding:1.5mm 2mm;border-bottom:1.2px solid #333}
    .printsheet .ptab th:nth-child(1){width:34%} .printsheet .ptab th:nth-child(2){width:15%} .printsheet .ptab th:nth-child(3){width:12%} .printsheet .ptab th:nth-child(4){width:11%} .printsheet .ptab th:nth-child(5){width:10%} .printsheet .ptab th:nth-child(6){width:18%}
    .printsheet .ptab td{padding:1.8mm 2mm;border-bottom:1px solid #cfd4da;vertical-align:top;font-size:10.5pt}
    .printsheet .ptab tr{break-inside:avoid}
    .printsheet .ptab td b{display:block;font-size:10.5pt}
    .printsheet .ptab td small{display:block;color:#444;font-size:8.5pt;margin-top:.5mm}
    .printsheet .ptab td.items{font-size:9pt;color:#333}
    .printsheet .ptab td.nowrap{white-space:nowrap}
    .printsheet .ptab .psecrow td{background:#f3f4f6;font-size:9pt;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1.2mm 2mm;border-bottom:1px solid #999}
