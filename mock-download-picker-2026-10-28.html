<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Download picker mock</title>
<style>
:root{--navy:#1D3058;--line:#e5e7eb;--mut:#6b7280;--blue:#1769e0}
body{margin:0;background:#eef1f6;font:14px/1.45 -apple-system,Inter,system-ui,sans-serif;color:#111827;padding:28px 16px}
.modal{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);overflow:hidden}
.hd{padding:18px 20px 10px}.hd h2{margin:0;font-size:18px;color:var(--navy)}.hd p{margin:4px 0 0;color:var(--mut);font-size:13px}
.bar{display:flex;gap:14px;padding:6px 20px 10px;font-size:12.5px}.bar a{color:var(--blue);text-decoration:none;font-weight:500}
.sec{border-top:1px solid var(--line);padding:12px 20px}
.sec h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between}
.sec h3 a{color:var(--blue);text-transform:none;letter-spacing:0;font-weight:500;text-decoration:none}
label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
input{margin-top:3px;width:16px;height:16px;accent-color:var(--navy)}
.t{font-weight:600}.s{display:block;font-size:12px;color:var(--mut);font-weight:400}
.ft{border-top:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:#fafbfc}
.cnt{font-size:12.5px;color:var(--mut)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 14px;font-size:13px}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
</style></head><body>
<div class="modal">
 <div class="hd"><h2>Download job sheets</h2><p>Wed 28 Oct. Everything is ticked. Untick what you do not need.</p></div>
 <div class="bar"><a href="#">Select all</a><a href="#">Clear all</a></div>

 <div class="sec"><h3>Loading sheets <a href="#">all</a></h3>
  <label><input type="checkbox" checked><span><span class="t">AB12 CDE, Alex and Chris</span><span class="s">1 drop: Brightline Media Ltd</span></span></label>
  <label><input type="checkbox" checked><span><span class="t">Hire vehicle, Dan</span><span class="s">2 drops</span></span></label>
 </div>

 <div class="sec"><h3>Delivery and site jobs <a href="#">all</a></h3>
  <label><input type="checkbox" checked><span><span class="t">Brightline Media Ltd</span><span class="s">2h install · Alex, Chris</span></span></label>
  <label><input type="checkbox" checked><span><span class="t">Acme Property Ltd</span><span class="s">Clearance · Dan</span></span></label>
  <label><input type="checkbox" checked><span><span class="t">Northgate Financial</span><span class="s">Collection · Dan</span></span></label>
 </div>

 <div class="sec"><h3>Production <a href="#">all</a></h3>
  <label><input type="checkbox" checked><span><span class="t">Harbour Design Co, 80 desks cut down</span><span class="s">Workshop · Pat</span></span></label>
  <label><input type="checkbox"><span><span class="t">Chair refurbishment, 100 classroom chairs</span><span class="s">Workshop · Kim</span></span></label>
 </div>

 <div class="ft"><span class="cnt">6 of 7 sheets</span><span><span class="btn">Cancel</span> <span class="btn pri">Download 6 sheets</span></span></div>
</div>
<p style="text-align:center;color:#6b7280;font-size:12.5px;margin-top:14px">Mock. Names are examples. The real list is built from the day in view.</p>
</body></html>
